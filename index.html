<meta charset="UTF-8">

<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .btn { display:inline-block; background: var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:15px; cursor:pointer; margin:4px 4px 4px 0; }
  .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .choices { display:grid; gap:10px; margin-top:16px; }
  .choice { text-align:left; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:17px; cursor:pointer; }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice.correct { background:#dcfce7; border-color: var(--ok); }
  .choice.wrong { background:#fee2e2; border-color: var(--bad); }
  .choice:disabled { cursor:default; }
  .word { font-size: 30px; font-weight: 700; }
  .progress { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .feedback { margin-top: 14px; font-size: 15px; min-height: 22px; line-height: 1.6; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }
  .def { color: var(--muted); font-size: 14px; }
  table { width:100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align:left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .mark-ok { color: var(--ok); font-weight: 700; }
  .mark-bad { color: var(--bad); font-weight: 700; }
  input[type=search] { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; margin-bottom:12px; }
  .hidden { display:none; }
  .score { font-size: 40px; font-weight: 700; margin: 6px 0; }
  .opt-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin: 10px 0; }
  .opt-row label { font-size: 15px; }
  .rootbox h3 { font-size: 16px; margin: 0 0 4px; }
  .rootbox .meaning { color: var(--accent); font-size: 14px; margin-bottom: 8px; }
  .nav { margin-bottom: 14px; }
  .tag { display:inline-block; font-size:12px; background:#eef2ff; color:#3730a3; border-radius:6px; padding:2px 6px; }
  .syns { color: var(--ink); }
  .sentence { font-size: 20px; line-height: 1.6; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <h1>504 Essential Words · Synonym Quiz</h1>
  <div class="sub">SSAT / ISEE Upper Level · Word List pp. 230–233</div>

  <div id="home" class="card">
    <p>Choose a quiz type and number of questions.</p>
    <div class="opt-row">
      <label><input type="radio" name="mode" value="syn" checked> Synonym</label>
      <label><input type="radio" name="mode" value="blank"> Fill in the blank</label>
    </div>
    <div class="opt-row">
      <label><input type="radio" name="n" value="10"> 10</label>
      <label><input type="radio" name="n" value="20" checked> 20</label>
      <label><input type="radio" name="n" value="30"> 30</label>
      <label><input type="radio" name="n" value="all"> All</label>
    </div>
    <button class="btn" onclick="startQuiz()">Start quiz</button>
    <button class="btn secondary" onclick="showRoots()">Browse by root</button>
    <button class="btn secondary" onclick="showList()">Browse all words</button>
  </div>

  <div id="quiz" class="card hidden">
    <div class="progress" id="progress"></div>
    <div class="word" id="qword"></div>
    <div class="sub" id="qhint" style="margin:4px 0 0">Which word is closest in meaning?</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn hidden" id="nextBtn" onclick="next()">Next</button>
  </div>

  <div id="result" class="hidden">
    <div class="card">
      <div>Score</div>
      <div class="score" id="scoreText"></div>
      <div id="scoreDetail" class="sub"></div>
      <button class="btn" onclick="startWrongOnly()" id="retryWrong">Retry wrong answers</button>
      <button class="btn secondary" onclick="goHome()">Home</button>
    </div>
    <div class="card">
      <h2>Explanation · Synonyms and Roots</h2>
      <table>
        <thead><tr><th style="width:24px"></th><th>Word</th><th>Synonyms</th><th>Definition</th><th>Root</th></tr></thead>
        <tbody id="explainBody"></tbody>
      </table>
    </div>
  </div>

  <div id="roots" class="hidden">
    <div class="nav"><button class="btn secondary" onclick="goHome()">← Home</button></div>
    <div class="card">
      <input type="search" id="rootSearch" placeholder="Search root, word, synonym or definition" oninput="renderRoots()">
      <div id="rootCount" class="sub"></div>
    </div>
    <div id="rootList"></div>
  </div>

  <div id="list" class="hidden">
    <div class="nav"><button class="btn secondary" onclick="goHome()">← Home</button></div>
    <div class="card">
      <input type="search" id="search" placeholder="Search word, synonym or definition" oninput="renderList()">
      <div id="listCount" class="sub"></div>
      <table>
        <thead><tr><th>Word</th><th>Synonyms</th><th>Definition</th><th>Root</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>
</div>

const DIST = Object.fromEntries(DIST_RAW.split("\n").map(l => { const i = l.indexOf("|"); return [l.slice(0, i), l.slice(i + 1).split(";").map(x => x.trim()).filter(Boolean)]; }));
const WORDS = RAW.trim().split("\n").map(l => {
  const [w, s, d, r] = l.split("|");
  const base = s.split(";").map(x => x.trim()).filter(Boolean);
  return { w, s: uniqCI([...base, ...(EXTRA[w] || [])]), d, r: r || "-", ex: EX[w] || "", dz: DIST[w] || [] };
});

let quiz = [], idx = 0, score = 0, log = [], current = null;

let curMode = "syn";
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function rootLabel(r) {
  return r === "-" ? "no clear root" : `${r} (${ROOTS[r] || "?"})`;
}
function makeOptions(item) {
  const hasDz = item.dz && item.dz.length === 3;
  if (curMode === "blank") {
    const d = hasDz ? item.dz : shuffle([...new Set(WORDS.map(x => x.w).filter(x => x !== item.w))]).slice(0, 3);
    return { correct: item.w, opts: shuffle([item.w, ...d]) };
  }
  const mine = new Set(item.s.map(x => x.toLowerCase()));
  const d = hasDz ? item.dz : shuffle([...new Set(WORDS.flatMap(x => x.s).filter(x => !mine.has(x.toLowerCase())))]).slice(0, 3);
  const correct = shuffle([...item.s])[0];
  return { correct, opts: shuffle([correct, ...d]) };
}
function isCorrect(pick) {
  if (current.mode === "blank") return pick.toLowerCase() === current.w.toLowerCase();
  return current.s.some(x => x.toLowerCase() === pick.toLowerCase());
}
function show(id) {
  ["home", "quiz", "result", "roots", "list"].forEach(s =>
    document.getElementById(s).classList.toggle("hidden", s !== id));
}
function goHome() { show("home"); }
function startQuiz() {
  curMode = document.querySelector('input[name="mode"]:checked').value;
  const sel = document.querySelector('input[name="n"]:checked').value;
  const n = sel === "all" ? WORDS.length : parseInt(sel, 10);
  startWith(shuffle([...WORDS]).slice(0, n));
}
function startWith(items) {
  quiz = items.map(it => ({ ...it, ...makeOptions(it), mode: curMode }));
  idx = 0; score = 0; log = [];
  show("quiz");
  renderQ();
}
function blankSentence(item) {
  const esc = item.w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("\\b" + esc + "\\b", "i");
  return re.test(item.ex) ? item.ex.replace(re, "_____") : item.ex + " (_____)";
}
function renderQ() {
  current = quiz[idx];
  document.getElementById("progress").textContent = `${idx + 1} / ${quiz.length} · Score ${score}`;
  const qw = document.getElementById("qword");
  const qh = document.getElementById("qhint");
  if (current.mode === "blank") {
    qw.className = "sentence";
    qw.textContent = blankSentence(current);
    qh.textContent = "Choose the word that best fits the blank.";
  } else {
    qw.className = "word";
    qw.textContent = current.w;
    qh.textContent = "Which word is closest in meaning?";
  }
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").classList.add("hidden");
  const box = document.getElementById("choices");
  box.innerHTML = "";
  current.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = o;
    b.onclick = () => answer(o);
    box.appendChild(b);
  });
}
function answer(pick) {
  const ok = isCorrect(pick);
  if (ok) score++;
  log.push({ ...current, pick, ok });
  document.querySelectorAll("#choices .choice").forEach(b => {
    b.disabled = true;
    if (isCorrect(b.textContent)) b.classList.add("correct");
    else if (b.textContent === pick) b.classList.add("wrong");
  });
  document.getElementById("feedback").innerHTML = `
    <span class="${ok ? "ok" : "bad"}">${ok ? "Correct." : "Incorrect."}</span>
    <div><b>${current.w}</b>: ${current.s.join("; ")}</div>
    <div class="def">${current.d}</div>
    <div class="def" style="font-style:italic">&ldquo;${current.ex}&rdquo;</div>
    <div><span class="tag">${rootLabel(current.r)}</span></div>`;
  const nb = document.getElementById("nextBtn");
  nb.textContent = idx + 1 < quiz.length ? "Next" : "See results";
  nb.classList.remove("hidden");
}
function next() {
  if (idx + 1 < quiz.length) { idx++; renderQ(); }
  else showResult();
}
function showResult() {
  show("result");
  const pct = Math.round((score / quiz.length) * 100);
  document.getElementById("scoreText").textContent = `${score} / ${quiz.length} (${pct}%)`;
  const wrong = log.filter(x => !x.ok).length;
  document.getElementById("scoreDetail").textContent = `${wrong} wrong`;
  document.getElementById("retryWrong").classList.toggle("hidden", wrong === 0);
  document.getElementById("explainBody").innerHTML = log.map(x => `
    <tr>
      <td class="${x.ok ? "mark-ok" : "mark-bad"}">${x.ok ? "O" : "X"}</td>
      <td><b>${x.w}</b><div class="def">${x.ex}</div></td>
      <td class="syns">${x.s.join("; ")}${x.ok ? "" : ` <span class="def">(you: ${x.pick})</span>`}</td>
      <td class="def">${x.d}</td>
      <td><span class="tag">${x.r}</span></td>
    </tr>`).join("");
}
function startWrongOnly() {
  const wrongWords = log.filter(x => !x.ok).map(x => WORDS.find(w => w.w === x.w));
  startWith(shuffle(wrongWords));
}
function showRoots() {
  show("roots");
  document.getElementById("rootSearch").value = "";
  renderRoots();
}
function renderRoots() {
  const q = document.getElementById("rootSearch").value.trim().toLowerCase();
  const rows = WORDS.filter(x => !q || [x.w, x.s.join(" "), x.d, x.r, ROOTS[x.r] || ""].some(t => t.toLowerCase().includes(q)));
  const groups = {};
  rows.forEach(x => (groups[x.r] = groups[x.r] || []).push(x));
  const keys = Object.keys(groups).sort((a, b) => {
    if (a === "-") return 1;
    if (b === "-") return -1;
    return groups[b].length - groups[a].length || a.localeCompare(b);
  });
  document.getElementById("rootCount").textContent = `${rows.length} words in ${keys.length} groups`;
  document.getElementById("rootList").innerHTML = keys.map(k => `
    <div class="card rootbox">
      <h3>${k === "-" ? "No clear root" : `<span class="tag">${k}</span> ${ROOTS[k] || ""}`}</h3>
      <div class="meaning">${groups[k].length} word${groups[k].length > 1 ? "s" : ""}</div>
      <table>
        <thead><tr><th>Word</th><th>Synonyms</th><th>Definition</th></tr></thead>
        <tbody>${groups[k].map(x => `<tr><td><b>${x.w}</b></td><td class="syns">${x.s.join("; ")}</td><td class="def">${x.d}</td></tr>`).join("")}</tbody>
      </table>
    </div>`).join("");
}
function showList() {
  show("list");
  document.getElementById("search").value = "";
  renderList();
}
function renderList() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const rows = WORDS.filter(x => !q || [x.w, x.s.join(" "), x.d, x.r].some(t => t.toLowerCase().includes(q)));
  document.getElementById("listCount").textContent = `${rows.length} / ${WORDS.length} words`;
  document.getElementById("listBody").innerHTML = rows.map(x =>
    `<tr><td><b>${x.w}</b><div class="def">${x.ex}</div></td><td class="syns">${x.s.join("; ")}</td><td class="def">${x.d}</td><td><span class="tag">${x.r}</span></td></tr>`).join("");
}
